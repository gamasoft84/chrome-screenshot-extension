<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Screenshot Saver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
    }

    .header {
      padding: 16px 20px 14px;
      border-bottom: 1px solid #2a2a38;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .header span {
      font-size: 11px;
      color: #666;
      margin-top: 1px;
    }

    .url-box {
      margin: 14px 20px 0;
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .url-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .url-text {
      font-size: 12px;
      color: #a0a0c0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 20px 0;
    }

    .stat-card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #a78bfa;
      margin-top: 2px;
    }

    .btn-capture {
      display: block;
      width: calc(100% - 40px);
      margin: 14px 20px 0;
      padding: 12px;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-capture:hover { opacity: 0.9; }
    .btn-capture:active { transform: scale(0.98); }
    .btn-capture:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-auto {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100% - 40px);
      margin: 10px 20px 0;
      padding: 10px 14px;
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .btn-auto:hover { border-color: #6c63ff; }

    .btn-auto-label {
      font-size: 12px;
      color: #c0c0d8;
    }

    .toggle {
      width: 36px; height: 20px;
      background: #333;
      border-radius: 10px;
      position: relative;
      transition: background 0.2s;
    }

    .toggle.on { background: #6c63ff; }

    .toggle::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      background: white;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: left 0.2s;
    }

    .toggle.on::after { left: 19px; }

    .interval-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin: 8px 20px 0;
      padding: 8px 14px;
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 8px;
    }

    .interval-row.visible { display: flex; }

    .interval-row label {
      font-size: 12px;
      color: #888;
    }

    .interval-row input {
      width: 60px;
      background: #0f0f13;
      border: 1px solid #333;
      border-radius: 5px;
      color: #e8e8f0;
      font-size: 13px;
      padding: 4px 8px;
      text-align: center;
    }

    .history {
      margin: 12px 20px 0;
    }

    .history-title {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .history-list {
      max-height: 90px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #1a1a24;
    }

    .history-dot {
      width: 6px; height: 6px;
      background: #6c63ff;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .history-name {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast {
      position: fixed;
      bottom: 16px; left: 20px; right: 20px;
      background: #1e1e2e;
      border: 1px solid #6c63ff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #a78bfa;
      display: none;
      animation: slideUp 0.2s ease;
    }

    .toast.show { display: block; }

    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .footer {
      margin: 14px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-clear {
      font-size: 11px;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
    }

    .btn-clear:hover { color: #e05050; }

    .status-dot {
      width: 6px; height: 6px;
      background: #333;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .status-dot.active {
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 11px;
      color: #555;
    }

    .hotkey-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 20px 0;
      padding: 9px 14px;
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 8px;
    }

    .hotkey-label {
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hotkey-badge {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .key {
      background: #0f0f13;
      border: 1px solid #3a3a50;
      border-bottom: 2px solid #3a3a50;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #a78bfa;
      font-family: monospace;
    }

    .key-sep {
      font-size: 10px;
      color: #444;
    }

    .btn-change-hotkey {
      font-size: 10px;
      color: #6c63ff;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 0;
      text-decoration: underline;
      text-decoration-style: dotted;
    }

    .btn-change-hotkey:hover { color: #a78bfa; }

    .btn-region {
      display: block;
      width: calc(100% - 40px);
      margin: 8px 20px 0;
      padding: 10px;
      background: transparent;
      color: #a78bfa;
      border: 1px dashed #6c63ff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s, border-style 0.15s;
    }
    .btn-region:hover { background: rgba(108,99,255,0.1); border-style: solid; }
    .btn-region:active { transform: scale(0.98); }

    .mode-row {
      display: flex;
      margin: 10px 20px 0;
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      overflow: hidden;
    }

    .mode-btn {
      flex: 1;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.3px;
    }

    .mode-btn.active {
      background: #6c63ff;
      color: #fff;
    }

    .mode-btn:not(.active):hover {
      color: #a0a0c0;
      background: #222230;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">📷</div>
    <div>
      <h1>Screenshot Saver</h1>
      <span>Auto-capture extension</span>
    </div>
  </div>

  <div class="url-box">
    <div class="url-label">Página actual</div>
    <div class="url-text" id="currentUrl">Cargando...</div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Esta URL</div>
      <div class="stat-value" id="countUrl">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total capturas</div>
      <div class="stat-value" id="countTotal">0</div>
    </div>
  </div>

  <button class="btn-capture" id="btnCapture">📸 Capturar ahora</button>

  <div class="mode-row">
    <button class="mode-btn active" id="modeFull" data-mode="full">🖥 Página completa</button>
    <button class="mode-btn" id="modeVisible" data-mode="visible">👁 Solo visible</button>
  </div>

  <div class="hotkey-row">
    <span class="hotkey-label">⌨️ Hotkey activo</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="hotkey-badge" id="hotkeyBadge">
        <span class="key">Ctrl</span>
        <span class="key-sep">+</span>
        <span class="key">Shift</span>
        <span class="key-sep">+</span>
        <span class="key">S</span>
      </div>
      <button class="btn-change-hotkey" id="btnChangeHotkey">cambiar</button>
    </div>
  </div>

  <button class="btn-region" id="btnRegion">✂️ Seleccionar región</button>

  <button class="btn-auto" id="btnAutoToggle">
    <span class="btn-auto-label">⏱ Captura automática</span>
    <div class="toggle" id="toggleAuto"></div>
  </button>

  <div class="interval-row" id="intervalRow">
    <label>Intervalo (seg)</label>
    <input type="number" id="intervalSecs" min="1" max="3600" value="10">
  </div>

  <div class="history">
    <div class="history-title">Capturas recientes</div>
    <div class="history-list" id="historyList">
      <div style="font-size:11px;color:#444;">Sin capturas aún</div>
    </div>
  </div>

  <div class="footer">
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Listo</span>
    </div>
    <button class="btn-clear" id="btnClear">Limpiar contadores</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
